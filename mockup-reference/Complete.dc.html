<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet in the Fog — log entry complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #E3E6DF; font-family: Inter, system-ui, sans-serif; color: #2F4F4F; display: flex; flex-direction: column; gap: 16px; padding: 8px 14px 16px">

<div style="display: flex; align-items: center; justify-content: flex-end; height: 48px">
<button aria-label="Share result" style="width: 44px; height: 44px; border: 0; background: transparent; color: #2F4F4F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15 V3"></path><path d="M8 7 L12 3 L16 7"></path><path d="M5 12 V20 H19 V12"></path></svg></button>
<button onClick="{{close}}" aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: #2F4F4F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
</div>

<div style="padding: 0 6px">
<div style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #4A6460">{{entryLabel}}</div>
<h1 style="margin: 4px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.1">{{headline}}</h1>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; font-weight: 600; color: #7A4E0E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 H15"></path><path d="M10 4 V7 H14 V4"></path><path d="M8 7 H16 L17.5 18 H6.5 Z"></path><path d="M6 21 H18"></path><path d="M12 11 V14.5"></path></svg>{{streak}}</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #F4EFE2; border-radius: 16px; padding: 14px 4px; box-shadow: 0 1px 0 rgba(47,79,79,0.08)">
<div style="text-align: center; padding: 0 4px">
<div style="font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 1">{{used}}</div>
<div style="font-size: 12px; color: #3E5551; margin-top: 6px">Guesses used</div>
</div>
<div style="text-align: center; padding: 0 4px; border-left: 1px solid #D5CFBD; border-right: 1px solid #D5CFBD">
<div style="font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 1">{{left}}</div>
<div style="font-size: 12px; color: #3E5551; margin-top: 6px">Guesses left</div>
</div>
<div style="text-align: center; padding: 0 4px">
<div style="font-family: Fraunces, Georgia, serif; font-size: 34px; line-height: 1">4.6</div>
<div style="font-size: 12px; color: #3E5551; margin-top: 6px">Harbor average</div>
<div style="font-size: 12px; color: #3E5551"><strong>212</strong> players</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 14px; background: #F7E9C2; border-radius: 16px; padding: 12px 16px; box-shadow: 0 0 0 1px #E3C77C">
<sc-if value="{{won}}" hint-placeholder-val="{{true}}">
<svg width="52" height="42" viewBox="0 0 40 32" aria-hidden="true"><path d="M20 4 L29 20 H11 Z" fill="#FBF8EF" stroke="#2F4F4F" stroke-width="1.2" stroke-linejoin="round"></path><line x1="20" y1="4" x2="20" y2="20" stroke="#2F4F4F" stroke-width="1"></line><path d="M3 20 H37 L30 28 H10 Z" fill="#FBF8EF" stroke="#2F4F4F" stroke-width="1.2" stroke-linejoin="round"></path></svg>
</sc-if>
<sc-if value="{{lost}}" hint-placeholder-val="{{false}}">
<svg width="52" height="42" viewBox="0 0 40 32" aria-hidden="true"><path d="M20 4 L29 20 H11 Z" fill="none" stroke="#2F4F4F" stroke-width="1.2" stroke-dasharray="2 2" stroke-linejoin="round"></path><path d="M3 20 H37 L30 28 H10 Z" fill="none" stroke="#2F4F4F" stroke-width="1.2" stroke-dasharray="2 2" stroke-linejoin="round"></path></svg>
</sc-if>
<div>
<div style="font-size: 12px; color: #5C4310">{{badgeKicker}}</div>
<div style="font-family: Fraunces, Georgia, serif; font-size: 19px; color: #2F4F4F">{{badgeName}}</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 15px; font-weight: 600; padding-left: 4px">Leave a note in the log</div>
<div style="background: #FBF9F2; border-radius: 16px; box-shadow: inset 0 0 0 1px #B9C2BD; overflow: hidden">
<textarea aria-label="Your comment" placeholder="How did this one go?" style="display: block; width: 100%; box-sizing: border-box; height: 84px; border: 0; background: transparent; resize: none; padding: 14px; font-size: 16px; color: #2F4F4F"></textarea>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 14px; border-top: 1px solid #D9DDD6">
<div>
<div style="font-size: 12px; color: #4A6460">Added to your comment</div>
<div style="font-size: 13px; font-weight: 600; margin-top: 2px">{{summary}}</div>
</div>
<button style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #2F4F4F; color: #F6F1E3; font-size: 14px; font-weight: 600; cursor: pointer">Submit</button>
</div>
</div>
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{openLog}}" style="min-height: 52px; border-radius: 14px; background: transparent; border: 1px solid #6F837D; color: #2F4F4F; font-size: 15px; font-weight: 600; cursor: pointer">Harbor log</button>
<button onClick="{{openFleet}}" style="min-height: 52px; border-radius: 14px; background: transparent; border: 1px solid #6F837D; color: #2F4F4F; font-size: 15px; font-weight: 600; cursor: pointer">Your fleet</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"won":{"editor":"boolean","default":true},"used":{"editor":"int","default":3,"min":1,"max":12},"max":{"editor":"int","default":8,"min":8,"max":12},"hints":{"editor":"int","default":0,"min":0,"max":5},"modeLabel":{"editor":null},"dateLabel":{"editor":null},"onClose":{"editor":null},"onLog":{"editor":null},"onFleet":{"editor":null},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, p = this.props;
    var won = p.won !== false;
    var used = p.used ?? 3, max = p.max ?? 8, hints = p.hints ?? 0;
    var mode = p.modeLabel || 'Easy', date = p.dateLabel || 'Nov 15, 2026';
    var shortDate = date.split(',')[0];
    var summary = shortDate + ' · ' + mode + ' · ' +
      (won ? used + ' of ' + max + ' guesses' : 'fleet slipped away') +
      (hints ? ' · ' + hints + (hints === 1 ? ' hint' : ' hints') : '');
    return {
      won: won, lost: !won,
      entryLabel: 'Log entry · ' + date,
      headline: won ? 'Fleet found' : 'The fleet slipped away',
      streak: won ? '4-day streak' : 'Streak resting at 4 days',
      used: String(used), left: String(Math.max(0, max - used)),
      badgeKicker: won ? 'New boat for your fleet · 3-day streak' : 'Something drifted in with the fog',
      badgeName: won ? 'Paper boat' : 'Mystery boat',
      summary: summary,
      close: function () { if (self.props.onClose) self.props.onClose(); },
      openLog: function () { if (self.props.onLog) self.props.onLog(); },
      openFleet: function () { if (self.props.onFleet) self.props.onFleet(); }
    };
  }
}
</script>
</body>
</html>
