<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet in the Fog — harbor log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #E3E6DF; font-family: Inter, system-ui, sans-serif; color: #2F4F4F; display: flex; flex-direction: column; gap: 14px; padding: 8px 14px 16px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding-left: 6px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 24px; color: #2F4F4F">Harbor log</h1>
<button onClick="{{close}}" aria-label="Close harbor log" style="width: 44px; height: 44px; border: 0; background: transparent; color: #2F4F4F; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; gap: 8px">
<button onClick="{{showAll}}" style="{{allStyle}}">All</button>
<button onClick="{{showUnsolved}}" style="{{unsolvedStyle}}">Unsolved</button>
</div>
<button onClick="{{goToday}}" style="{{todayStyle}}">Today</button>
</div>

<div style="display: flex; align-items: center; gap: 6px">
<button onClick="{{prevWeek}}" aria-label="Previous week" style="{{prevStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="11 6 5 12 11 18"></polyline></svg></button>
<div style="flex-grow: 1; background: #F4EFE2; border-radius: 14px; padding: 10px 8px; text-align: center; box-shadow: inset 0 0 0 1px rgba(47,79,79,0.10)">
<div style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #4A6460">{{weekTheme}}</div>
<div style="font-family: Fraunces, Georgia, serif; font-size: 17px; margin-top: 2px">{{weekRange}}</div>
</div>
<button onClick="{{nextWeek}}" aria-label="Next week" style="{{nextStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="13 6 19 12 13 18"></polyline></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button onClick="{{d.pick}}" aria-label="{{d.aria}}" style="{{d.style}}">
<span style="font-size: 12px; color: #4A6460">{{d.weekday}}</span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 20px; line-height: 1.15">{{d.date}}</span>
<span style="{{d.statusStyle}}">
<sc-if value="{{d.isStar}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z"></path></svg></sc-if>
<sc-if value="{{d.isCheck}}" hint-placeholder-val="{{true}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17 19 7"></polyline></svg></sc-if>
<sc-if value="{{d.isLost}}" hint-placeholder-val="{{false}}"><svg width="14" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 10 Q6 6 10 10 T18 10 T24 10"></path><path d="M2 16 Q6 12 10 16 T18 16 T24 16"></path></svg></sc-if>
<sc-if value="{{d.isOpen}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg></sc-if>
<sc-if value="{{d.isToday}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg></sc-if>
{{d.status}}
</span>
</button>
</sc-for>
</div>

<sc-if value="{{emptyWeek}}" hint-placeholder-val="{{false}}">
<div style="text-align: center; padding: 28px 12px; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 17px; color: #4A6460">All clear this week. Every fleet found.</div>
</sc-if>

<div style="margin-top: auto; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #3E5551">
<span style="display: flex; align-items: center; gap: 5px; color: #7A4E0E"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 L14.6 9.4 L22 12 L14.6 14.6 L12 22 L9.4 14.6 L2 12 L9.4 9.4 Z"></path></svg>Perfect: 3 guesses or fewer</span>
<span style="display: flex; align-items: center; gap: 5px"><svg width="13" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 10 Q6 6 10 10 T18 10 T24 10"></path><path d="M2 16 Q6 12 10 16 T18 16 T24 16"></path></svg>Fleet slipped away</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"onPick":{"editor":null},"$preview":{"width":390,"height":900}}'>
var LAUNCH = Date.UTC(2026, 9, 26); // Mon Oct 26, 2026 = puzzle #1
var TODAY_NUM = 21;                  // Sun Nov 15, 2026
var WEEKS = ['Calm Waters', 'Northern Route', 'Harbor Lights'];
var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// sample play history: g = guesses used, lost = ran out, missing = not played
var RESULTS = {
  1: { g: 4 }, 2: { g: 3 }, 3: { g: 6 }, 5: { g: 2 }, 6: { lost: true }, 7: { g: 5 },
  8: { g: 4 }, 10: { g: 3 }, 11: { g: 7 }, 12: { g: 4 }, 13: { g: 5 },
  15: { g: 3 }, 16: { g: 6 }, 17: { g: 4 }, 18: { lost: true }, 19: { g: 5 }, 20: { g: 2 }
};
var LAST_WEEK = Math.floor((TODAY_NUM - 1) / 7);
var PILL = 'min-height: 44px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; ';
var ARROW = 'width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; ';

function dateOf(n) { return new Date(LAUNCH + (n - 1) * 86400000); }
function fmt(d) { return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate(); }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { week: LAST_WEEK, filter: 'all' };
  }

  renderVals() {
    var self = this, s = this.state;
    var first = s.week * 7 + 1, last = first + 6;
    var start = dateOf(first), end = dateOf(last);
    var range = start.getUTCMonth() === end.getUTCMonth()
      ? fmt(start) + ' – ' + end.getUTCDate() + ', ' + end.getUTCFullYear()
      : fmt(start) + ' – ' + fmt(end) + ', ' + end.getUTCFullYear();

    var days = [];
    for (var n = first; n <= last; n++) {
      (function (n) {
        var r = RESULTS[n], isToday = n === TODAY_NUM, future = n > TODAY_NUM;
        var solved = r && !r.lost;
        if (s.filter === 'unsolved' && (solved || future)) return;
        var status, kind;
        if (future) { status = 'Coming soon'; kind = 'none'; }
        else if (isToday) { status = 'Today'; kind = 'today'; }
        else if (!r) { status = 'Not played'; kind = 'open'; }
        else if (r.lost) { status = 'Slipped away'; kind = 'lost'; }
        else if (r.g <= 3) { status = 'Perfect · ' + r.g; kind = 'star'; }
        else { status = 'Solved · ' + r.g; kind = 'check'; }
        var base = 'min-height: 104px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; color: #2F4F4F; ';
        var look = isToday ? 'background: #F7E9C2; border: 2px solid #D9A441; box-shadow: 0 0 14px rgba(217,164,65,0.45); cursor: pointer;' :
                   future ? 'background: #EAE7DD; border: 2px dashed #C5C9C0; opacity: 0.7; cursor: default;' :
                   'background: #F4EFE2; border: 2px solid transparent; box-shadow: 0 1px 0 rgba(47,79,79,0.08); cursor: pointer;';
        var statusColor = kind === 'star' ? '#7A4E0E' : kind === 'today' ? '#7A4E0E' : '#2F4F4F';
        days.push({
          weekday: DAYS[(n - 1) % 7], date: fmt(dateOf(n)), num: '#' + n, status: status,
          isStar: kind === 'star', isCheck: kind === 'check', isLost: kind === 'lost', isOpen: kind === 'open', isToday: kind === 'today',
          aria: DAYS[(n - 1) % 7] + ' ' + fmt(dateOf(n)) + ', ' + status,
          statusStyle: 'display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; font-weight: 600; color: ' + statusColor + ';',
          style: base + look,
          pick: future ? function () {} : function () { if (self.props.onPick) self.props.onPick(fmt(dateOf(n)) + ', ' + dateOf(n).getUTCFullYear()); }
        });
      })(n);
    }

    var canPrev = s.week > 0, canNext = s.week < LAST_WEEK;
    var on = 'background: #2F4F4F; color: #F6F1E3; border: 1px solid #2F4F4F;';
    var off = 'background: transparent; color: #2F4F4F; border: 1px solid #9AA8A3;';

    return {
      days: days, emptyWeek: days.length === 0,
      weekTheme: 'Week ' + (s.week + 1) + ' · ' + WEEKS[s.week % WEEKS.length],
      weekRange: range,
      allStyle: PILL + (s.filter === 'all' ? on : off),
      unsolvedStyle: PILL + (s.filter === 'unsolved' ? on : off),
      todayStyle: PILL + (s.week === LAST_WEEK ? 'background: transparent; color: #4A6460; border: 1px solid #C5C9C0;' : off),
      prevStyle: ARROW + (canPrev ? 'color: #2F4F4F; cursor: pointer;' : 'color: #A9B3AF; cursor: default;'),
      nextStyle: ARROW + (canNext ? 'color: #2F4F4F; cursor: pointer;' : 'color: #A9B3AF; cursor: default;'),
      prevWeek: function () { if (canPrev) self.setState({ week: s.week - 1 }); },
      nextWeek: function () { if (canNext) self.setState({ week: s.week + 1 }); },
      goToday: function () { self.setState({ week: LAST_WEEK }); },
      showAll: function () { self.setState({ filter: 'all' }); },
      showUnsolved: function () { self.setState({ filter: 'unsolved' }); },
      close: function () { if (self.props.onClose) self.props.onClose(); }
    };
  }
}
</script>
</body>
</html>
