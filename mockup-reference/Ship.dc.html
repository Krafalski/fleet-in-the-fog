<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ship icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{boxStyle}}">
<sc-if value="{{isYacht}}" hint-placeholder-val="{{true}}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 32" aria-hidden="true"><line x1="20" y1="3" x2="20" y2="22" stroke="#3E4A47" stroke-width="1.5"></line><path d="M21 4 L21 21 L32 21 Z" fill="#B5543B"></path><path d="M19 8 L19 21 L11 21 Z" fill="#E3B98F"></path><path d="M3 22 H37 L33 28 H7 Z" fill="#3E4A47"></path></svg>
</sc-if>
<sc-if value="{{isTug}}" hint-placeholder-val="{{false}}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 32" aria-hidden="true"><rect x="20" y="7" width="4" height="7" fill="#1F2A2A"></rect><rect x="13" y="13" width="15" height="9" rx="1.5" fill="#E8D9B0"></rect><rect x="16" y="15" width="3" height="3" fill="#2E4A6B"></rect><rect x="22" y="15" width="3" height="3" fill="#2E4A6B"></rect><path d="M4 22 H36 L32 28 H8 Z" fill="#2E4A6B"></path></svg>
</sc-if>
<sc-if value="{{isMailboat}}" hint-placeholder-val="{{false}}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 32" aria-hidden="true"><rect x="13" y="7" width="4" height="8" fill="#1F2A2A"></rect><rect x="23" y="7" width="4" height="8" fill="#1F2A2A"></rect><rect x="9" y="15" width="22" height="6" fill="#F1E6CC"></rect><path d="M2 21 H38 L34 28 H6 Z" fill="#B5543B"></path><circle cx="20" cy="24.5" r="1.8" fill="#F1E6CC"></circle></svg>
</sc-if>
<sc-if value="{{isSchooner}}" hint-placeholder-val="{{false}}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 32" aria-hidden="true"><line x1="14" y1="4" x2="14" y2="22" stroke="#2F3B3A" stroke-width="1.5"></line><line x1="25" y1="2" x2="25" y2="22" stroke="#2F3B3A" stroke-width="1.5"></line><path d="M15 5 L15 21 L23 21 Z" fill="#3F6E68"></path><path d="M26 3 L26 21 L35 21 Z" fill="#3F6E68"></path><path d="M13 8 L13 21 L6 21 Z" fill="#9DBDB6"></path><path d="M3 22 H37 L33 28 H7 Z" fill="#2F3B3A"></path></svg>
</sc-if>
<sc-if value="{{isFisher}}" hint-placeholder-val="{{false}}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 32" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="22" stroke="#3E4A47" stroke-width="1.5"></line><line x1="12" y1="6" x2="20.5" y2="12.5" stroke="#3E4A47" stroke-width="1"></line><rect x="21" y="13" width="11" height="9" fill="#F1E6CC"></rect><rect x="20" y="12" width="13" height="1.5" fill="#3E4A47"></rect><rect x="23.5" y="15.5" width="6" height="3" fill="#3E4A47"></rect><path d="M3 22 H37 L33 28 H7 Z" fill="#D9A441"></path></svg>
</sc-if>
<sc-if value="{{isJunk}}" hint-placeholder-val="{{false}}">
<svg width="{{w}}" height="{{h}}" viewBox="0 0 40 32" aria-hidden="true"><path d="M12 4 Q28 1 31 12 L31 22.5 L13.1 22.5 Z" fill="#6B5577"></path><line x1="12.4" y1="9" x2="29.5" y2="9" stroke="#F1E6CC" stroke-width="1"></line><line x1="12.7" y1="13.5" x2="31" y2="13.5" stroke="#F1E6CC" stroke-width="1"></line><line x1="12.9" y1="18" x2="31" y2="18" stroke="#F1E6CC" stroke-width="1"></line><path d="M2 21 Q20 23 38 20 L33 28 H8 Z" fill="#3E4A47"></path></svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["yacht","tug","mailboat","schooner","fisher","junk"],"default":"yacht"},"scale":{"editor":"float","default":1,"min":0.5,"max":2,"step":0.05},"$preview":{"width":44,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    var k = this.props.kind || 'yacht';
    var sc = Number(this.props.scale) || 1;
    return {
      w: Math.round(40 * sc), h: Math.round(32 * sc),
      boxStyle: 'width: ' + Math.round(44 * sc) + 'px; height: ' + Math.round(40 * sc) + 'px; display: flex; align-items: center; justify-content: center',
      isYacht: k === 'yacht', isTug: k === 'tug', isMailboat: k === 'mailboat',
      isSchooner: k === 'schooner', isFisher: k === 'fisher', isJunk: k === 'junk'
    };
  }
}
</script>
</body>
</html>
